name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Test on both Linux (typical CI) and Windows (the test script
        # was Unix-only prior to v1.1.0 — keep it that way).
        os: [ubuntu-latest, windows-latest]
        # The published package runs fine on Node 18+ (no Node 20-only
        # APIs in src/), but ESLint 9 requires Node ^20.19 || ^22.13 || >=24.
        # We can't lint on Node 18 in CI, so we test on the versions our
        # dev tooling supports. Node 18 consumers are still supported at
        # runtime (see "engines" in package.json).
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run test:js-compat
